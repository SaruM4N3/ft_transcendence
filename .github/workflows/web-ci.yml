name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Detect Node project
        id: node
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      # Once a frontend/backend framework is added (package.json with lint/build scripts), these
      # steps take over automatically — no workflow changes needed.
      - name: Install dependencies
        if: steps.node.outputs.has_package_json == 'true'
        run: npm ci

      - name: Lint
        if: steps.node.outputs.has_package_json == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.node.outputs.has_package_json == 'true'
        run: npm run build --if-present

      # Until then, at least catch JS syntax errors in the plain scaffold.
      - name: Syntax-check plain JS scaffold
        if: steps.node.outputs.has_package_json == 'false'
        run: |
          shopt -s globstar nullglob
          for f in **/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate docker compose config
        run: docker compose -f compose.yaml config >/dev/null

      - name: Build Docker image
        run: docker build -t transcendence-web:ci .
